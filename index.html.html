<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>POSJITU</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
body { font-family: Arial, sans-serif; background: #050505; color: #fff; overflow-x: hidden; }

/* Latar belakang: letakkan image.png satu folder dengan index.html */
.background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background-image: url("./image.png");
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    z-index: 0;
    pointer-events: none;
}
.background-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.30) 45%, rgba(0,0,0,.65) 100%);
    z-index: 1;
    pointer-events: none;
}
.background-glow {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 35%, rgba(255,190,0,.18), transparent 35%),
        radial-gradient(circle at 15% 70%, rgba(255,0,0,.16), transparent 35%),
        radial-gradient(circle at 85% 70%, rgba(255,0,0,.16), transparent 35%);
    z-index: 2;
    pointer-events: none;
}
.background-vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.55) 100%);
    z-index: 3;
    pointer-events: none;
}
.container {
    position: relative;
    z-index: 4;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.card {
    width: 100%;
    padding: 20px;
    background: rgba(0,0,0,.72);
    border: 2px solid #d7a92b;
    border-radius: 14px;
    box-shadow: 0 0 15px rgba(255,190,0,.45), 0 0 40px rgba(255,0,0,.20);
}
.btn {
    display: block;
    width: 100%;
    margin: 14px 0;
    padding: 17px 10px;
    border-radius: 9px;
    border: 2px solid #e2b42e;
    text-decoration: none;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(90deg, #a80000, #e60000, #a80000);
    box-shadow: 0 0 12px rgba(255,0,0,.4);
    transition: all .3s ease;
}
.btn.daftar {
    color: #111;
    background: linear-gradient(90deg, #d29b12, #ffe36a, #d29b12);
    border-color: #fff0a0;
    box-shadow: 0 0 12px rgba(255,200,0,.4);
}
.btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 0 20px rgba(255,200,0,.7);
}
.footer {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: #ddd;
    text-shadow: 0 0 5px rgba(255,190,0,.5);
}
@media (max-width: 480px) {
    .container { padding: 15px; }
    .card { padding: 15px; }
    .btn { font-size: 17px; padding: 16px 10px; }
}
</style>
</head>
<body>
<div class="background"></div>
<div class="background-overlay"></div>
<div class="background-glow"></div>
<div class="background-vignette"></div>
<div class="container">
    <div class="card">
        <a href="https://direct-to-pos.site/posads" class="btn">LOGIN POSJITU</a>
        <a href="https://direct-to-pos.site/posads" class="btn daftar">DAFTAR POSJITU</a>
        <div class="footer">© 2026 POSJITU - All Rights Reserved</div>
    </div>
</div>
</body>
</html>
